# A version tag builds one immutable tarball, publishes it to npmjs with
# provenance, and mirrors the same bytes to GitHub Packages.
name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use stable semantic versioning (vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match package version '$PACKAGE_VERSION'"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test with coverage gates
        run: npm run test:ci

      - name: Audit development dependencies
        run: npm run audit:dev

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Verify package contents
        run: npm run verify:package

      - name: Create immutable package tarball
        run: |
          PACKAGE_TARBALL="$(npm pack --ignore-scripts)"
          mv "$PACKAGE_TARBALL" assinafy-package.tgz

      - name: Upload package tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assinafy-package
          path: assinafy-package.tgz
          if-no-files-found: error
          retention-days: 1

  live-sandbox:
    name: Verify Assinafy sandbox
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: assinafy-sandbox
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Run sandbox integration tests
        run: npx jest tests/live.integration.test.ts --runInBand
        env:
          ASSINAFY_LIVE: '1'
          ASSINAFY_LIVE_DESTRUCTIVE: '1'
          ASSINAFY_LIVE_WORKSPACE_MUTATIONS: '0'
          ASSINAFY_LIVE_CREDIT_MUTATIONS: '1'
          ASSINAFY_API_KEY: ${{ secrets.ASSINAFY_API_KEY }}
          ASSINAFY_ACCOUNT_ID: ${{ secrets.ASSINAFY_ACCOUNT_ID }}
          ASSINAFY_TEST_EMAIL_PRIMARY: ${{ secrets.ASSINAFY_TEST_EMAIL_PRIMARY }}
          ASSINAFY_TEST_EMAIL_SECONDARY: ${{ secrets.ASSINAFY_TEST_EMAIL_SECONDARY }}
          ASSINAFY_BASE_URL: https://sandbox.assinafy.com.br/v1

  npmjs:
    name: Publish to npmjs
    needs: [package, live-sandbox]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download package tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: assinafy-package

      - name: Publish with provenance
        run: npm publish assinafy-package.tgz --ignore-scripts --access public --provenance --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-packages:
    name: Mirror to GitHub Packages
    needs: [package, live-sandbox, npmjs]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          registry-url: https://npm.pkg.github.com
          scope: '@assinafy'
          package-manager-cache: false

      - name: Download package tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: assinafy-package

      - name: Publish mirror
        run: npm publish assinafy-package.tgz --ignore-scripts --access public --provenance=false --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
