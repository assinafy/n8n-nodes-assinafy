# Publishes @assinafy/n8n-nodes-assinafy to the GitHub Packages npm registry
# whenever a version tag is pushed.
#
# Authentication: the built-in GITHUB_TOKEN is used. No external secrets are
# required when the token's default permissions include `packages: write`
# (granted explicitly in this workflow).
#
# Tag convention: tags matching `*.*.*` (e.g. `0.2.0`). If you prefer `v`-
# prefixed tags (e.g. `v0.2.0`), change the filter below to `v*.*.*`.
#
# Local release flow:
#   npm run release
# which lints, builds, bumps the version, commits the changelog, tags, and
# pushes — the tag push triggers this workflow to publish.
#
# Dual-publishing to npmjs.com (optional): add an additional job that sets
# `registry-url: 'https://registry.npmjs.org'` and uses an `NPM_TOKEN`
# secret (or OIDC trusted publishing). Remove the `publishConfig.registry`
# field from package.json only if you drop GitHub Packages entirely.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@assinafy'

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          # Accept both `1.3.0` and `v1.3.0` tag styles (repo uses the v-prefix).
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match package.json version '$PKG_VERSION'"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        # --ignore-scripts skips the `prepublishOnly` → `n8n-node prerelease`
        # lifecycle hook, which is a hardcoded guard that refuses `npm publish`
        # and tells you to run `npm run release` instead. That guard is meant
        # for local use; in CI we've already built and lint-checked above.
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
