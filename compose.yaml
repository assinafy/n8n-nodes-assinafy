services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.40.5@sha256:9f693fd5565539efd5e75ad168526c8041a6af516d9e50bc4d9cb1c9c5031523
    restart: unless-stopped
    ports:
      - '127.0.0.1:5679:5678'
    environment:
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_TEMPLATES_ENABLED: 'false'
      N8N_SECURE_COOKIE: '${N8N_SECURE_COOKIE:-false}'
      N8N_EDITOR_BASE_URL: '${N8N_EDITOR_BASE_URL:-http://localhost:5679}'
      WEBHOOK_URL: '${WEBHOOK_URL:-http://localhost:5679/}'
      N8N_PROXY_HOPS: '1'
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        mkdir -p /home/node/.n8n/nodes/node_modules/@assinafy/n8n-nodes-assinafy
        cp -R /opt/assinafy/. /home/node/.n8n/nodes/node_modules/@assinafy/n8n-nodes-assinafy/
        exec /docker-entrypoint.sh
    volumes:
      - n8n_data:/home/node/.n8n
      - ./dist:/opt/assinafy/dist:ro
      - ./package.json:/opt/assinafy/package.json:ro

volumes:
  n8n_data:
